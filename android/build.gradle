// Android launcher module.
// Only included in the build when local.properties (with sdk.dir) exists —
// open the project in Android Studio and it will set that up for you.
plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

configurations { natives }

android {
    namespace 'com.ironfront.android'
    compileSdk 34

    defaultConfig {
        applicationId 'com.ironfront.android'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '0.1'
        ndk { abiFilters 'armeabi-v7a', 'arm64-v8a' }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions { jvmTarget = '11' }

    sourceSets {
        main {
            java.srcDirs = ['src/main/kotlin']
            assets.srcDirs = ['../assets']
        }
    }

    packagingOptions {
        resources.excludes += ['META-INF/AL2.0', 'META-INF/LGPL2.1']
    }
}

dependencies {
    implementation project(':core')
    implementation 'com.badlogicgames.gdx:gdx-backend-android:1.12.1'
    natives 'com.badlogicgames.gdx:gdx-platform:1.12.1:natives-armeabi-v7a'
    natives 'com.badlogicgames.gdx:gdx-platform:1.12.1:natives-arm64-v8a'
}

// unzip libGDX native .so files from the natives jars into jniLibs (standard libGDX wiring)
tasks.register('copyAndroidNatives') {
    doLast {
        configurations.natives.files.each { jar ->
            def abi = null
            if (jar.name.endsWith('natives-armeabi-v7a.jar')) abi = 'armeabi-v7a'
            if (jar.name.endsWith('natives-arm64-v8a.jar')) abi = 'arm64-v8a'
            if (abi != null) {
                copy {
                    from zipTree(jar)
                    into file("src/main/jniLibs/${abi}")
                    include '*.so'
                }
            }
        }
    }
}
tasks.named('preBuild') { dependsOn 'copyAndroidNatives' }
